[project]
name = "fichabase"
version = "0.1.0"
description = "FichaBase - fichas técnicas de cozinha, insumos e usuários."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "streamlit-authenticator>=0.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# N999: Streamlit exige nomes de página tipo "1_Dashboard.py" no diretório pages/.
"pages/*.py" = ["N999"]
